version: 2

models:
  - name: dim_customers
    description: Customer dimension built from cleaned Silver customer data.

    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

      - name: country_code
        tests:
          - not_null

  - name: fct_trips
    description: Trip fact table enriched with customer and payment attributes.

    columns:
      - name: trip_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

    - name: dim_drivers
    description: Driver dimension built from cleaned Silver driver data.

    columns:
      - name: driver_id
        tests:
          - not_null
          - unique

      - name: country_code
        tests:
          - not_null

      - name: rating
        tests:
          - not_null
